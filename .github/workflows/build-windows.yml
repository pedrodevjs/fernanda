name: Build Windows app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Fernanda app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Fernanda-Windows
          path: dist/Fernanda.exe
